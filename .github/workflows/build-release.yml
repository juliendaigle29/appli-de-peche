# Version "release" signée (pour le Play Store ou une installation officielle).
# À lancer à la main : onglet Actions -> "Construire l'APK signé" -> Run workflow.
# Demande 4 secrets dans Settings -> Secrets and variables -> Actions :
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (voir README, section "Version signée")
name: Construire l'APK signé

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Capacitor
        run: npm install --ignore-scripts

      - name: Synchroniser le projet Android (www -> android)
        run: npx cap sync android

      - name: Installer le SDK Android (API 36)
        uses: android-actions/setup-android@v3

      - name: Installer les outils de compilation 36.0.0
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compiler l'APK signé
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Récupérer l'APK signé
        uses: actions/upload-artifact@v4
        with:
          name: Appli-de-peche-signee
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
