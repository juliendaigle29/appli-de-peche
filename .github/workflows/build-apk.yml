# Compile l'APK de Carnet de pêche Québec, sans rien installer sur l'ordinateur.
# Comment ça marche : on dépose le projet sur GitHub, GitHub compile tout seul,
# et l'APK apparaît en téléchargement dans l'onglet Actions.
name: Construire l'APK

on:
  workflow_dispatch: # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 exige Java 21 (voir android/app/capacitor.build.gradle)
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Le projet Android a besoin de la bibliothèque Capacitor (node_modules)
      - name: Installer Capacitor
        run: npm install --ignore-scripts

      - name: Synchroniser le projet Android (www -> android)
        run: npx cap sync android

      # Le coureur Ubuntu de GitHub a un SDK Android préinstallé, mais
      # sdkmanager n'est pas dans le PATH : on l'appelle par son chemin complet.
      - name: Installer le SDK Android (API 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Carnet-de-peche-Quebec
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publie l'APK en téléchargement public (sans compte GitHub)
      - name: Publier l'APK en téléchargement public
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-${{ github.run_number }}
          name: Carnet de pêche Québec v2.0 (compilation ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
